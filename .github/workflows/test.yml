name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # macOS: run everything on the system bash 3.2, not a newer one from
      # Homebrew, and without GNU coreutils, as a user's Mac would be
      - if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          /bin/bash --version | head -1
          for t in timeout gtimeout tac flock; do command -v "$t" || true; done
      # jq ships with both runners; claude, at and launchctl are faked
      - run: bash tests/run.sh

  # プラグインのフック・モジュール: 最新の Claude Code で検証し、テストする
  hooks-module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
